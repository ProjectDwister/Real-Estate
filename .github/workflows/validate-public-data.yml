name: Validate public dataset
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public CSV schema and privacy guard
        run: |
          python - <<'PY'
          import csv, json, pathlib

          forbidden={'seller_name','purchaser_name'}
          required={'year','registration_date','doc_no','document_name','village','property_no'}

          manifest=pathlib.Path('data/data_manifest.json')
          if not manifest.exists():
              raise SystemExit('Missing data/data_manifest.json')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          csvs=[pathlib.Path(x) for x in m.get('base',[])]
          csvs += [pathlib.Path(x['url'] if isinstance(x,dict) else x) for x in m.get('enriched',[])]

          if not csvs:
              raise SystemExit('Manifest contains no data files')

          total=0
          for p in csvs:
              if not p.exists():
                  raise SystemExit(f'Missing manifest data file: {p}')
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.reader(f)
                  header=next(r)
                  rows=sum(1 for _ in r)
              bad=forbidden.intersection(header)
              if bad:
                  raise SystemExit(f'Private columns in {p}: {sorted(bad)}')
              missing=required.difference(header)
              if missing:
                  raise SystemExit(f'Missing required columns in {p}: {sorted(missing)}')
              total += rows
              print(f'{p}: {rows} rows OK')

          print(f'Public dataset validation passed across {len(csvs)} files ({total} raw rows before browser dedupe)')
          PY
